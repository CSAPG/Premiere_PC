<svg viewBox="0 0 300 220" xmlns="http://www.w3.org/2000/svg">
  <!-- ciel -->
  <rect x="0" y="0" width="300" height="220" fill="#E8F1F8"/>
  <!-- soleil discret -->
  <circle cx="252" cy="38" r="18" fill="#FDF0E8"/>
  <circle cx="252" cy="38" r="18" fill="none" stroke="#E8783A" stroke-width="1.5" opacity="0.5"/>
  <!-- relief neigeux en fond -->
  <path d="M0,150 Q60,130 130,148 T300,140 L300,220 L0,220 Z" fill="#FFFFFF"/>
  <path d="M0,168 Q80,152 150,166 T300,160 L300,220 L0,220 Z" fill="#F5F7FA"/>
  <!-- flocons -->
  <circle cx="40" cy="40" r="2.4" fill="#B8D4EC"/>
  <circle cx="90" cy="70" r="1.8" fill="#B8D4EC"/>
  <circle cx="200" cy="90" r="2.2" fill="#B8D4EC"/>
  <circle cx="30" cy="95" r="1.6" fill="#B8D4EC"/>

  <!-- lignes de mouvement -->
  <g stroke="#5A6B7A" stroke-width="2" stroke-linecap="round" opacity="0.55">
    <line x1="20" y1="176" x2="42" y2="176"/>
    <line x1="16" y1="188" x2="38" y2="188"/>
    <line x1="22" y1="200" x2="44" y2="200"/>
  </g>

  <!-- traîneau : caisse en bois -->
  <g>
    <rect x="150" y="150" width="80" height="32" rx="5" fill="#E8783A"/>
    <rect x="150" y="150" width="80" height="9" rx="4" fill="#f2924f"/>
    <!-- lattes -->
    <line x1="160" y1="182" x2="160" y2="150" stroke="#c8602a" stroke-width="1.5" opacity="0.5"/>
    <line x1="180" y1="182" x2="180" y2="150" stroke="#c8602a" stroke-width="1.5" opacity="0.5"/>
    <line x1="200" y1="182" x2="200" y2="150" stroke="#c8602a" stroke-width="1.5" opacity="0.5"/>
    <line x1="220" y1="182" x2="220" y2="150" stroke="#c8602a" stroke-width="1.5" opacity="0.5"/>
    <!-- patins (runners) -->
    <path d="M145,192 Q145,200 160,200 L228,200" fill="none" stroke="#2D5F8A" stroke-width="4" stroke-linecap="round"/>
    <line x1="158" y1="182" x2="158" y2="198" stroke="#2D5F8A" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="222" y1="182" x2="222" y2="198" stroke="#2D5F8A" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- corde -->
  <path d="M150,164 Q120,160 96,150" fill="none" stroke="#1A2A3A" stroke-width="2"/>

  <!-- personnage qui tire le traîneau -->
  <g>
    <circle cx="70" cy="128" r="12" fill="#2D5F8A"/>
    <path d="M70,140 L70,172" stroke="#2D5F8A" stroke-width="6" stroke-linecap="round"/>
    <path d="M70,146 L96,150" stroke="#2D5F8A" stroke-width="5" stroke-linecap="round"/>
    <path d="M70,172 L58,198" stroke="#2D5F8A" stroke-width="6" stroke-linecap="round"/>
    <path d="M70,172 L84,196" stroke="#2D5F8A" stroke-width="6" stroke-linecap="round"/>
    <path d="M70,150 L52,142" stroke="#2D5F8A" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- flèche rouge : sens du mouvement -->
  <g>
    <line x1="55" y1="70" x2="115" y2="70" stroke="#C0392B" stroke-width="2.6"/>
    <polygon points="115,70 106,65 106,75" fill="#C0392B"/>
    <text x="85" y="58" font-family="Nunito, sans-serif" font-size="11" font-weight="700" fill="#C0392B" text-anchor="middle">v</text>
    <line x1="79" y1="47" x2="89" y2="47" stroke="#C0392B" stroke-width="1.6" stroke-linecap="round"/>
    <polygon points="91,47 85,44 85,50" fill="#C0392B"/>
  </g>
</svg>
